<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>OLT Мониторинг</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322c55e'/%3E%3Cpath d='M8 20a8 8 0 0 1 16 0M12 20a4 4 0 0 1 8 0' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --card:#1c2230; --card-h:#232b3b; --line:#2a3242;
  --text:#e6edf3; --muted:#8b96a8; --accent:#22c55e; --accent-t:#04130a;
  --up:#22c55e; --down:#ef4444; --unk:#6b7280; --star:#f5b301;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.18);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f5f8; --bg2:#ffffff; --card:#ffffff; --card-h:#f7f9fc; --line:#dde3ec;
  --text:#121826; --muted:#5d6878; --accent-t:#ffffff; --shadow:0 1px 2px rgba(15,23,42,.06),0 6px 18px rgba(15,23,42,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- login ---------- */
#lock{position:fixed;inset:0;display:grid;place-items:center;padding:16px;z-index:50;
  background:radial-gradient(1200px 600px at 20% 0%,rgba(34,197,94,.12),transparent),var(--bg)}
.lock-box{width:100%;max-width:340px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}
.lock-box h2{margin:0 0 4px;font-size:22px}
.lock-box p{margin:0 0 20px;color:var(--muted);font-size:14px}
.field{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);margin-bottom:12px;outline:none}
.field:focus{border-color:var(--accent)}
.check{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px;margin:4px 0 16px;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--card-h)}
.btn-primary{width:100%;background:var(--accent);border-color:var(--accent);color:var(--accent-t);font-weight:600;padding:12px}
.btn-primary:hover{filter:brightness(1.08);background:var(--accent)}
.err{color:var(--down);font-size:14px;min-height:20px;margin-top:10px}

/* ---------- layout ---------- */
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;padding:14px 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-right:auto}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.search{position:relative;flex:1;max-width:520px}
.search input{width:100%;padding:10px 40px 10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);outline:none}
.search input:focus{border-color:var(--accent)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--bg2);cursor:pointer}
.icon-btn:hover{background:var(--card-h)}
.icon-btn svg{width:18px;height:18px}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 0 12px}
.chip{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;display:flex;gap:6px;align-items:center}
.chip b{font-weight:500;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-t)}
.chip.on b{color:inherit;opacity:.75}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--bg2);padding:6px 12px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--card-h);font-weight:600}

/* ---------- summary ---------- */
.summary{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:120px}
.stat .n{font-size:22px;font-weight:700}
.stat .l{font-size:13px;color:var(--muted)}
.stat.down .n{color:var(--down)} .stat.up .n{color:var(--up)}
.note-line{color:var(--muted);font-size:13px;margin:-4px 0 12px}

/* ---------- cards ---------- */
h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s,background .15s}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 50%,var(--line));background:var(--card-h)}
.card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--cat,var(--accent))}
.card.is-down{border-color:color-mix(in srgb,var(--down) 60%,var(--line))}
.c-head{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--unk);flex:none}
.dot.up{background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 22%,transparent)}
.dot.down{background:var(--down);box-shadow:0 0 0 3px color-mix(in srgb,var(--down) 25%,transparent);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}
.c-name{font-weight:650;font-size:16px;color:inherit;text-decoration:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-name::after{content:"";position:absolute;inset:0;border-radius:14px}
.star{position:relative;z-index:2;border:0;background:none;cursor:pointer;padding:2px;color:var(--muted);font-size:18px;line-height:1}
.star.on{color:var(--star)}
.c-meta{display:flex;align-items:center;gap:8px;min-width:0;color:var(--muted);font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.copy{position:relative;z-index:2;border:1px solid var(--line);background:transparent;border-radius:6px;padding:1px 6px;font-size:12px;cursor:pointer;color:var(--muted)}
.copy:hover{color:var(--text)}
.c-note{color:var(--muted);font-size:13px}
.c-st{font-size:12px;color:var(--muted)}
.c-st.down{color:var(--down)}

/* compact list view */
.list .grid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:6px}
.list .card{flex-direction:row;align-items:center;padding:8px 12px;border-radius:10px;box-shadow:none;gap:10px}
.list .card::before{top:8px;bottom:8px}
.list .card:hover{transform:none}
.list .c-head{flex:1 1 auto;min-width:0}
.list .c-meta{flex:none;font-size:12px}
.list .copy{display:none}
.list .c-name{font-size:14px}
.list .c-note,.list .c-st{display:none}
.list .c-name::after{border-radius:10px}

.empty{text-align:center;color:var(--muted);padding:60px 0}
footer{color:var(--muted);font-size:13px;text-align:center;padding:40px 16px}

/* ---------- settings ---------- */
.drawer{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;background:rgba(0,0,0,.4)}
.panel{width:100%;max-width:360px;height:100%;background:var(--bg2);border-left:1px solid var(--line);padding:20px;overflow:auto}
.panel h2{margin:0 0 16px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row label{font-size:14px}
.row small{display:block;color:var(--muted);font-size:12px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:var(--text)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:640px){
  .top{flex-wrap:wrap}
  .logo{width:100%}
  .search{max-width:none}
  .search kbd{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 12px}
  .bar::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{min-width:0;padding:8px 12px}
  .stat .n{font-size:20px}
  .c-meta{flex-wrap:wrap;gap:4px}
  .copy{display:none}
  .list .grid{grid-template-columns:1fr}
  .card{padding:12px 10px 10px 12px}
  .c-name{font-size:14px;white-space:normal;overflow-wrap:anywhere}
  .c-meta{font-size:11px}
}
</style>
</head>
<body>

<!-- ===== Экран входа ===== -->
<div id="lock">
  <form class="lock-box" id="lockForm" autocomplete="on">
    <h2>🔒 OLT Мониторинг</h2>
    <p>Список объектов зашифрован. Введите пароль.</p>
    <input class="field" type="text" name="username" value="olt" autocomplete="username" hidden>
    <input class="field" id="pw" type="password" placeholder="Пароль" autocomplete="current-password" required autofocus>
    <label class="check"><input type="checkbox" id="remember"> Запомнить на этом устройстве</label>
    <button class="btn btn-primary" id="unlockBtn" type="submit">Войти</button>
    <div class="err" id="err"></div>
  </form>
</div>

<!-- ===== Основная страница ===== -->
<div id="app" class="hidden">
  <header>
    <div class="wrap">
      <div class="top">
        <div class="logo"><i></i>OLT Мониторинг</div>
        <div class="search">
          <input id="q" type="search" placeholder="Поиск по названию или IP… (Enter — открыть)" autocomplete="off">
          <kbd>/</kbd>
        </div>
        <button class="icon-btn" id="viewBtn" title="Плитки / список"></button>
        <button class="icon-btn" id="setBtn" title="Настройки">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
      <div class="bar" id="chips"></div>
    </div>
  </header>

  <main class="wrap">
    <div class="summary" id="summary"></div>
    <div class="note-line" id="statusNote"></div>
    <div id="content"></div>
  </main>
  <footer id="foot"></footer>
</div>

<!-- ===== Настройки ===== -->
<div class="drawer hidden" id="drawer">
  <div class="panel">
    <h2>Настройки <button class="icon-btn" id="closeSet" title="Закрыть">✕</button></h2>
    <div class="row">
      <label>Тема</label>
      <div class="seg" id="themeSeg">
        <button data-v="auto">Авто</button><button data-v="dark">Тёмная</button><button data-v="light">Светлая</button>
      </div>
    </div>
    <div class="row">
      <label>Акцентный цвет</label>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="row">
      <label>Группировать по типу<small>Иначе — один общий список</small></label>
      <input type="checkbox" id="optGroup">
    </div>
    <div class="row">
      <label>Упавшие — первыми<small>Работает, если настроены статусы</small></label>
      <input type="checkbox" id="optDownFirst">
    </div>
    <div class="row">
      <label>Открывать в новой вкладке</label>
      <input type="checkbox" id="optNewTab">
    </div>
    <div class="row">
      <label>Выйти<small>Забыть пароль на этом устройстве</small></label>
      <button class="btn" id="logout">Выйти</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================= Конфигурация ================= */
const DATA_URL   = "olts.enc.json";   // зашифрованный список (делается в tools/encrypt.html)
const STATUS_URL = "status.json";     // статусы (пишет checker/check.py). Нет файла — статусы просто скрыты
const STATUS_REFRESH_SEC = 60;

const GROUP_COLORS = {
  "Серверы и VPN":"#3b82f6","Школы и колледжи":"#f59e0b","Медицина":"#ef4444",
  "Бизнес и офисы":"#a855f7","Госорганы":"#14b8a6","Населённые пункты":"#22c55e","Дома и ОВН":"#ec4899"
};
const ACCENTS = ["#22c55e","#3b82f6","#a855f7","#f59e0b","#ef4444","#14b8a6","#ec4899"];

/* ================= Утилиты ================= */
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem("olt."+k); return v===null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem("olt."+k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem("olt."+k); }catch{} }
};
const ss = {
  get(k){ try{ return sessionStorage.getItem("olt."+k); }catch{ return null; } },
  set(k,v){ try{ sessionStorage.setItem("olt."+k, v); }catch{} },
  del(k){ try{ sessionStorage.removeItem("olt."+k); }catch{} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1600); }
async function sha256hex(s){
  const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function ago(iso){
  if(!iso) return "";
  const s = Math.max(0, (Date.now()-new Date(iso))/1000);
  if(s<60) return "только что";
  if(s<3600) return Math.round(s/60)+" мин назад";
  if(s<86400) return Math.round(s/3600)+" ч назад";
  return Math.round(s/86400)+" дн назад";
}

/* ================= Расшифровка ================= */
async function decryptList(password){
  const res = await fetch(DATA_URL, {cache:"no-store"});
  if(!res.ok) throw new Error("Не найден файл "+DATA_URL);
  const e = await res.json();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", hash:"SHA-256", salt:b64(e.salt), iterations:e.iter},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  let plain;
  try{ plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(e.iv)}, key, b64(e.ct)); }
  catch{ throw new Error("Неверный пароль"); }
  return JSON.parse(new TextDecoder().decode(plain));
}

/* ================= Состояние ================= */
let OLTS = [];            // [{name, ip, port, group, note, url, id}]
let STATUS = null;        // {updated, items:{id:{up,ms,since}}}
const state = {
  q: "",
  group: store.get("group", "all"),
  view: store.get("view", "grid"),
  theme: store.get("theme", "auto"),
  accent: store.get("accent", ACCENTS[0]),
  favs: new Set(store.get("favs", [])),
  grouped: store.get("grouped", true),
  downFirst: store.get("downFirst", true),
  newTab: store.get("newTab", true),
};

/* ================= Вход ================= */
async function unlock(pw, remember){
  const btn = $("#unlockBtn"); btn.disabled = true; btn.textContent = "Проверка…"; $("#err").textContent = "";
  try{
    const list = await decryptList(pw);
    OLTS = await Promise.all(list.map(async o => ({
      ...o,
      url: o.url || `http://${o.ip}:${o.port}`,
      id: (await sha256hex(`${o.ip}:${o.port}`)).slice(0,12)
    })));
    ss.set("pw", pw);
    if(remember) store.set("pw", pw);
    $("#lock").classList.add("hidden");
    $("#app").classList.remove("hidden");
    render(); loadStatus(); setInterval(loadStatus, STATUS_REFRESH_SEC*1000);
  }catch(err){
    $("#err").textContent = err.message;
    store.del("pw"); ss.del("pw");
  }finally{ btn.disabled = false; btn.textContent = "Войти"; }
}
$("#lockForm").addEventListener("submit", e => { e.preventDefault(); unlock($("#pw").value, $("#remember").checked); });
$("#logout").onclick = () => { store.del("pw"); ss.del("pw"); location.reload(); };

/* ================= Статусы ================= */
async function loadStatus(){
  try{
    const r = await fetch(STATUS_URL+"?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw 0;
    STATUS = await r.json();
  }catch{ STATUS = null; }
  render();
}
const st = o => STATUS && STATUS.items ? STATUS.items[o.id] : undefined;

/* ================= Отрисовка ================= */
function applyTheme(){
  const t = state.theme === "auto" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : state.theme;
  document.documentElement.dataset.theme = t;
  document.documentElement.style.setProperty("--accent", state.accent);
  document.querySelectorAll("#themeSeg button").forEach(b => b.classList.toggle("on", b.dataset.v === state.theme));
  $("#swatches").innerHTML = ACCENTS.map(c => `<span class="sw ${c===state.accent?"on":""}" data-c="${c}" style="background:${c}"></span>`).join("");
  $("#viewBtn").innerHTML = state.view === "grid"
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>';
  document.body.classList.toggle("list", state.view === "list");
  $("#optGroup").checked = state.grouped; $("#optDownFirst").checked = state.downFirst; $("#optNewTab").checked = state.newTab;
}

function matches(o){
  const q = state.q.trim().toLowerCase();
  if(q && !(`${o.name} ${o.ip}:${o.port} ${o.note||""} ${o.group}`.toLowerCase().includes(q))) return false;
  if(state.group === "fav") return state.favs.has(o.id);
  if(state.group === "down") return st(o) && !st(o).up;
  if(state.group !== "all") return o.group === state.group;
  return true;
}

function sortFn(a, b){
  if(state.downFirst && STATUS){
    const da = st(a) && !st(a).up ? 0 : 1, db = st(b) && !st(b).up ? 0 : 1;
    if(da !== db) return da - db;
  }
  return a.name.localeCompare(b.name, "ru", {numeric:true});
}

function cardHTML(o){
  const s = st(o);
  const cls = s ? (s.up ? "up" : "down") : "";
  const stText = !STATUS ? "" : !s ? "нет данных"
    : s.up ? `в сети${s.ms!=null ? " · "+s.ms+" мс" : ""}` : `недоступен${s.since ? " · "+ago(s.since) : ""}`;
  const fav = state.favs.has(o.id);
  return `<div class="card ${cls==="down"?"is-down":""}" style="--cat:${GROUP_COLORS[o.group]||"var(--accent)"}">
    <div class="c-head">
      <span class="dot ${cls}" title="${esc(stText||"статус не настроен")}"></span>
      <a class="c-name" href="${esc(o.url)}" ${state.newTab?'target="_blank" rel="noopener noreferrer"':''} title="${esc(o.name)}">${esc(o.name)}</a>
      <button class="star ${fav?"on":""}" data-fav="${o.id}" title="${fav?"Убрать из избранного":"В избранное"}">${fav?"★":"☆"}</button>
    </div>
    <div class="c-meta"><span>${esc(o.ip)}:${o.port}</span><button class="copy" data-copy="${esc(o.ip)}" title="Копировать IP">копир.</button></div>
    ${o.note ? `<div class="c-note">${esc(o.note)}</div>` : ""}
    ${stText ? `<div class="c-st ${cls}">${esc(stText)}</div>` : ""}
  </div>`;
}

function render(){
  applyTheme();
  // чипы
  const groups = [...new Set(OLTS.map(o => o.group))].sort((a,b)=>a.localeCompare(b,"ru"));
  const downCount = STATUS ? OLTS.filter(o => st(o) && !st(o).up).length : 0;
  const chips = [["all","Все",OLTS.length],["fav","★ Избранное",state.favs.size]];
  if(STATUS) chips.push(["down","Недоступны",downCount]);
  groups.forEach(g => chips.push([g,g,OLTS.filter(o=>o.group===g).length]));
  if(!chips.some(c => c[0] === state.group)) state.group = "all";
  $("#chips").innerHTML = chips.map(([v,l,n]) =>
    `<button class="chip ${state.group===v?"on":""}" data-g="${esc(v)}">${esc(l)} <b>${n}</b></button>`).join("");

  // сводка
  if(STATUS){
    const up = OLTS.filter(o => st(o) && st(o).up).length;
    const unk = OLTS.length - up - downCount;
    $("#summary").innerHTML =
      `<div class="stat"><div class="n">${OLTS.length}</div><div class="l">всего OLT</div></div>
       <div class="stat up"><div class="n">${up}</div><div class="l">в сети</div></div>
       <div class="stat down"><div class="n">${downCount}</div><div class="l">недоступны</div></div>
       ${unk?`<div class="stat"><div class="n">${unk}</div><div class="l">нет данных</div></div>`:""}`;
    const age = (Date.now()-new Date(STATUS.updated))/1000;
    $("#statusNote").textContent = `Статусы обновлены ${ago(STATUS.updated)}` + (age > 600 ? " — проверялка, похоже, не работает" : "");
  }else{
    $("#summary").innerHTML = `<div class="stat"><div class="n">${OLTS.length}</div><div class="l">всего OLT</div></div>`;
    $("#statusNote").textContent = "Статусы не настроены (нет status.json) — см. README, раздел «Проверка статусов».";
  }

  // карточки
  const list = OLTS.filter(matches).sort(sortFn);
  let html = "";
  if(!list.length){
    html = `<div class="empty">Ничего не найдено</div>`;
  }else if(state.grouped && state.group === "all" && !state.q){
    const isDown = o => STATUS && st(o) && !st(o).up;
    const downs = state.downFirst ? list.filter(isDown) : [];
    if(downs.length) html += `<h3 class="sec" style="color:var(--down)">● Недоступны · ${downs.length}</h3><div class="grid">${downs.map(cardHTML).join("")}</div>`;
    const favs = list.filter(o => state.favs.has(o.id) && !downs.includes(o));
    if(favs.length) html += `<h3 class="sec">★ Избранное</h3><div class="grid">${favs.map(cardHTML).join("")}</div>`;
    groups.forEach(g => {
      const items = list.filter(o => o.group === g && !state.favs.has(o.id) && !downs.includes(o));
      if(items.length) html += `<h3 class="sec">${esc(g)} · ${items.length}</h3><div class="grid">${items.map(cardHTML).join("")}</div>`;
    });
  }else{
    html = `<div class="grid" style="margin-top:12px">${list.map(cardHTML).join("")}</div>`;
  }
  $("#content").innerHTML = html;
  $("#foot").textContent = `Показано ${list.length} из ${OLTS.length}`;
}

/* ================= События ================= */
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("#q").addEventListener("keydown", e => {
  if(e.key === "Enter"){ const a = document.querySelector(".c-name"); if(a) window.open(a.href, state.newTab ? "_blank" : "_self", "noopener"); }
  if(e.key === "Escape"){ e.target.value = ""; state.q = ""; render(); e.target.blur(); }
});
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if((e.key === "/" && !typing) || ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === "k")){ e.preventDefault(); $("#q").focus(); }
  if(e.key === "Escape") $("#drawer").classList.add("hidden");
});
document.addEventListener("click", e => {
  const g = e.target.closest("[data-g]");    if(g){ state.group = g.dataset.g; store.set("group", state.group); render(); return; }
  const f = e.target.closest("[data-fav]");  if(f){ const id=f.dataset.fav; state.favs.has(id)?state.favs.delete(id):state.favs.add(id); store.set("favs",[...state.favs]); render(); return; }
  const c = e.target.closest("[data-copy]"); if(c){ navigator.clipboard.writeText(c.dataset.copy).then(()=>toast("IP скопирован: "+c.dataset.copy), ()=>toast(c.dataset.copy)); return; }
  const s = e.target.closest(".sw");         if(s){ state.accent = s.dataset.c; store.set("accent", state.accent); applyTheme(); return; }
  const t = e.target.closest("#themeSeg button"); if(t){ state.theme = t.dataset.v; store.set("theme", state.theme); applyTheme(); return; }
});
$("#viewBtn").onclick = () => { state.view = state.view === "grid" ? "list" : "grid"; store.set("view", state.view); render(); };
$("#setBtn").onclick = () => $("#drawer").classList.remove("hidden");
$("#closeSet").onclick = () => $("#drawer").classList.add("hidden");
$("#drawer").addEventListener("click", e => { if(e.target.id === "drawer") e.target.classList.add("hidden"); });
$("#optGroup").onchange = e => { state.grouped = e.target.checked; store.set("grouped", state.grouped); render(); };
$("#optDownFirst").onchange = e => { state.downFirst = e.target.checked; store.set("downFirst", state.downFirst); render(); };
$("#optNewTab").onchange = e => { state.newTab = e.target.checked; store.set("newTab", state.newTab); render(); };
matchMedia("(prefers-color-scheme: light)").addEventListener("change", applyTheme);

/* ================= Старт ================= */
applyTheme();
const saved = ss.get("pw") || store.get("pw", null);
if(saved) unlock(saved, false);
</script>
</body>
</html>
